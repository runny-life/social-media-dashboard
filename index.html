<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media Dashboard</title>
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <div class="header__content">
          <h1 class="header__title">Social Media Dashboard</h1>
          <p class="header__description">Total Followers: 23,004</p>
        </div>
        <hr class="header__line" />
        <div class="header__actions toggle-theme">
          <p class="toggle-theme__title">Dark Mode</p>
          <button
            class="toggle-theme__button"
            type="button"
            role="switch"
            aria-checked="false"
            aria-label="Toggle theme"
          >
            <span class="toggle-theme__button--icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <main class="content">
      <section class="stats-followers" aria-labelledby="stats-followers-title">
        <div class="stats-followers__inner container">
          <h2 class="visually-hidden" id="stats-followers-title">Sats followers</h2>
          <ul class="stats-followers__list">
            <li class="stats-followers__item">
              <article class="card-follower">
                <div class="card-follower-name-container">
                  <img
                    class="card-follower__icon-social"
                    src="./src/assets/icons/icon-facebook.svg"
                    alt="Facebook"
                    width="20"
                    height="20"
                    loading="lazy"
                  />
                  <p class="stats-followers__name">@nathanf</p>
                </div>
                <div class="card-followers__stats">
                  <h3 class="card-follower__stat-number">1987</h3>
                  <p class="card-follower__title">Followers</p>
                </div>
                <div class="card-follower__change">
                  <img
                    class="card-follower__change-icon"
                    src="./src/assets/icons/icon-up.svg"
                    alt=""
                    width="8"
                    height="4"
                    loading="lazy"
                  />
                  <p class="card-follower__stat-change">12 Today</p>
                </div>
              </article>
            </li>
            <li class="stats-followers__item">
              <article class="card-follower">
                <div class="card-follower-name-container">
                  <img
                    class="card-follower__icon-social"
                    src="./src/assets/icons/icon-twitter.svg"
                    alt="Twitter"
                    width="20"
                    height="20"
                    loading="lazy"
                  />
                  <p class="stats-followers__name">@nathanf</p>
                </div>
                <div class="card-followers__stats">
                  <h3 class="card-follower__stat-number">1044</h3>
                  <p class="card-follower__title">Followers</p>
                </div>
                <div class="card-follower__change">
                  <img
                    class="card-follower__change-icon"
                    src="./src/assets/icons/icon-up.svg"
                    alt=""
                    width="8"
                    height="4"
                    loading="lazy"
                  />
                  <p class="card-follower__stat-change">99 Today</p>
                </div>
              </article>
            </li>
            <li class="stats-followers__item">
              <article class="card-follower">
                <div class="card-follower-name-container">
                  <img
                    class="card-follower__icon-social"
                    src="./src/assets/icons/icon-instagram.svg"
                    alt="Instagram"
                    width="20"
                    height="20"
                    loading="lazy"
                  />
                  <p class="stats-followers__name">@nathanf</p>
                </div>
                <div class="card-followers__stats">
                  <h3 class="card-follower__stat-number">11k</h3>
                  <p class="card-follower__title">Followers</p>
                </div>
                <div class="card-follower__change">
                  <img
                    class="card-follower__change-icon"
                    src="./src/assets/icons/icon-up.svg"
                    alt=""
                    width="8"
                    height="4"
                    loading="lazy"
                  />
                  <p class="card-follower__stat-change">1099 Today</p>
                </div>
              </article>
            </li>
            <li class="stats-followers__item">
              <article class="card-follower">
                <div class="card-follower-name-container">
                  <img
                    class="card-follower__icon-social"
                    src="./src/assets/icons/icon-youtube.svg"
                    alt="YouTube"
                    width="20"
                    height="20"
                    loading="lazy"
                  />
                  <p class="stats-followers__name">@nathanf</p>
                </div>
                <div class="card-followers__stats">
                  <h3 class="card-follower__stat-number">8239</h3>
                  <p class="card-follower__title">SUBSCRIBERS</p>
                </div>
                <div class="card-follower__change">
                  <img
                    class="card-follower__change-icon"
                    src="./src/assets/icons/icon-down.svg"
                    alt=""
                    width="8"
                    height="4"
                    loading="lazy"
                  />
                  <p class="card-follower__stat-change card-follower__stat-change--down">
                    144 Today
                  </p>
                </div>
              </article>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <script type="module" src="./src/scripts/app.js"></script>
  </body>
</html>
